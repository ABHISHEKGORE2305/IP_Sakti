name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.10 is what the Docker image ships and requirements.txt is pinned against.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # CPU-only torch first, as in the Dockerfile: otherwise pip resolves
        # the CUDA build and several GB of unused NVIDIA libraries.
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check src scripts tests app.py healthcheck.py --output-format=github

      - name: Mypy
        run: mypy src tests

      - name: Tests
        # Fast, hermetic tier only: no Qdrant, model weights, corpus data or
        # LLM keys. Integration tests run locally with `pytest -m integration`.
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sih_frontend_antigrav
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sih_frontend_antigrav/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
