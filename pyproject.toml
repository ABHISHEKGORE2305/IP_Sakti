[project]
name = "ip-sakti"
version = "1.0.0"
description = "Citation-grounded RAG assistant for Ayurvedic IPR and regulatory law"
# 3.10 is what the Docker image ships and the pinned requirements.txt are
# verified against; CI also runs the suite on 3.14.
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
extend-exclude = ["venv", "sih_frontend_antigrav", "video_production", "brag-output", ".agents"]

[tool.ruff.lint]
# pyflakes + the error subset of pycodestyle, plus bugbear (real bug
# patterns), isort and pyupgrade. Style-only rules are left out on purpose.
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Scripts put src/ on sys.path before importing project modules.
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
  "agents", "engines", "guardrails", "server", "config", "db", "observability",
  "rag_pipeline", "llm", "prompt",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
# The codebase is only partially annotated: check the bodies of annotated
# functions, but don't demand annotations everywhere yet.
check_untyped_defs = false
warn_unused_ignores = true
exclude = ["^venv/", "^sih_frontend_antigrav/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not integration and not llm'"
markers = [
  "integration: needs Qdrant, the embedding/reranker models, or data/processed/ (run with -m integration)",
  "llm: calls a real LLM provider and needs GROQ_API_KEY or GEMINI_API_KEY (run with -m llm)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  # db.py caches one SQLite connection per thread; TestClient worker threads
  # open one against each test's throwaway database and never close it.
  "ignore:unclosed database:ResourceWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*", "src/test_*.py"]

[tool.coverage.report]
skip_empty = true
